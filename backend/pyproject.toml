[project]
name = "local-ai-agents-backend"
version = "1.0.0"
description = "FastAPI backend for a local AI agents dashboard"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20,<1.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic-settings>=2.4,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[tool.uv]
package = false
